<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="batikGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="batikGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Base Grid Lines -->
  <path d="M 0 60 L 120 60 M 60 0 L 60 120" stroke="#ca8a04" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2,2"/>
  <path d="M 0 0 L 120 120 M 120 0 L 0 120" stroke="#16a34a" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Center Kawung Petals -->
  <g transform="translate(60, 60)">
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="0" cy="22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="-22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>

    <!-- Inner Petals Gold -->
    <ellipse cx="0" cy="-22" rx="7" ry="14" fill="none" stroke="url(#batikGold)" stroke-width="1" stroke-dasharray="3,1.5"/>
    <ellipse cx="0" cy="22" rx="7" ry="14" fill="none" stroke="url(#batikGold)" stroke-width="1" stroke-dasharray="3,1.5"/>
    <ellipse cx="-22" cy="0" rx="14" ry="7" fill="none" stroke="url(#batikGold)" stroke-width="1" stroke-dasharray="3,1.5"/>
    <ellipse cx="22" cy="0" rx="14" ry="7" fill="none" stroke="url(#batikGold)" stroke-width="1" stroke-dasharray="3,1.5"/>

    <!-- Stamen Dots -->
    <circle cx="0" cy="-22" r="2.5" fill="#ca8a04"/>
    <circle cx="0" cy="22" r="2.5" fill="#ca8a04"/>
    <circle cx="-22" cy="0" r="2.5" fill="#ca8a04"/>
    <circle cx="22" cy="0" r="2.5" fill="#ca8a04"/>

    <!-- Center Diamond & Rosette -->
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4.5" fill="#16a34a"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <!-- 4 Corner Kawung Elements for Seamless Tiling -->
  <g transform="translate(0, 0)">
    <ellipse cx="0" cy="22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="0" cy="22" r="2.5" fill="#ca8a04"/>
    <circle cx="22" cy="0" r="2.5" fill="#ca8a04"/>
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4.5" fill="#16a34a"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <g transform="translate(120, 0)">
    <ellipse cx="0" cy="22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="-22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="0" cy="22" r="2.5" fill="#ca8a04"/>
    <circle cx="-22" cy="0" r="2.5" fill="#ca8a04"/>
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4.5" fill="#16a34a"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <g transform="translate(0, 120)">
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="0" cy="-22" r="2.5" fill="#ca8a04"/>
    <circle cx="22" cy="0" r="2.5" fill="#ca8a04"/>
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4.5" fill="#16a34a"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <g transform="translate(120, 120)">
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="-22" cy="0" rx="22" ry="14" fill="url(#batikGreen)" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="0" cy="-22" r="2.5" fill="#ca8a04"/>
    <circle cx="-22" cy="0" r="2.5" fill="#ca8a04"/>
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#ca8a04" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4.5" fill="#16a34a"/>
    <circle cx="0" cy="0" r="2" fill="#fef08a"/>
  </g>

  <!-- Batik Dots Texture -->
  <g fill="#16a34a" opacity="0.35">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="90" cy="30" r="1.5"/>
    <circle cx="30" cy="90" r="1.5"/>
    <circle cx="90" cy="90" r="1.5"/>
  </g>
</svg>
